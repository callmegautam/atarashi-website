name: Feature request
description: Something the site should do and does not
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What were you trying to do when the site got in the way?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: What you would like instead
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
