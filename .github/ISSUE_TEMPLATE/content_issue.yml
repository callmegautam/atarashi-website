name: Content or docs issue
description: Something the site says is wrong, unclear or out of date
labels: [content, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Documentation pages under `/docs` are synced from the CLI repo. If the
        wording itself is wrong, open the issue there instead. Use this template
        for landing page copy, or for a docs page that renders incorrectly.
  - type: input
    id: url
    attributes:
      label: Page
      placeholder: "https://atarashi.gautamsuthar.in/"
    validations: { required: true }
  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: Quote the exact text.
    validations: { required: true }
  - type: textarea
    id: suggestion
    attributes:
      label: What it should say instead
